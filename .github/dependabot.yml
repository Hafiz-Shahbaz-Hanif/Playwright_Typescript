version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      # These must stay version-compatible with each other (playwright-bdd generates
      # specs for a specific Playwright range), so they move in one PR.
      playwright:
        patterns:
          - "playwright"
          - "@playwright/*"
          - "playwright-bdd"
      allure:
        patterns:
          - "allure-*"
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Lint config is `.eslintrc.json`; ESLint 9+ moves to flat config (v10 drops the
      # old format), so a major bump needs a deliberate migration, not an auto-PR.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@typescript-eslint/*"
        update-types: ["version-update:semver-major"]
      # typescript-eslint 8.x declares support for TypeScript >=4.8.4 <6.1.0, so a
      # TypeScript 7 bump is outside the supported range - revisit once that widens.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci(deps)"
    groups:
      actions:
        patterns:
          - "*"
